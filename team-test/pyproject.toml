[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================================
# Project metadata
# =============================================================================

[project]
name = "task-manager"
version = "1.0.0"
description = "A lightweight, file-backed task management CLI tool."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Task Manager Contributors" },
]
keywords = ["task", "todo", "cli", "productivity", "task-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Python 3.8+ required for dataclasses (stdlib) and from __future__ annotations
requires-python = ">=3.8"

# No third-party runtime dependencies
dependencies = []

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

# ---------------------------------------------------------------------------
# Entry points — installs a ``tasks`` command on the PATH
# ---------------------------------------------------------------------------

[project.scripts]
tasks = "team-test.cli:main"

# =============================================================================
# Tool configuration
# =============================================================================

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "-q",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["."]
omit = [
    "test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------

[tool.isort]
profile = "black"
line_length = 88

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.8"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
