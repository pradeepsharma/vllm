# Babel extraction configuration for vLLM i18n
# This file specifies how Babel should extract translatable strings from Python source files

[python: **.py]
# Extract strings from Python files
# Patterns to match:
# - _("message") - gettext
# - lazy_("message") - lazy_gettext
# - ngettext("singular", "plural", n) - plural forms
# - pgettext("context", "message") - context-aware translation
extract_messages = _
                   lazy_
                   ngettext
                   pgettext

[jinja2: **/templates/**.html]
# Extract strings from Jinja2 templates (if any)
# Patterns to match:
# - {{ _("message") }}
# - {% trans %}message{% endtrans %}
# - {% pluralize %}
encoding = utf-8

[ignore_patterns: **.pyc]
# Ignore compiled Python files
