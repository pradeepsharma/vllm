[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "0.1.0"
description = "A Python CLI task tracker built with Click and Rich"
authors = [{ name = "Task Tracker Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
task-tracker = "task_tracker.cli:cli"

[tool.setuptools.packages.find]
where = [".."]
include = ["task_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
test = [
    "pytest>=7.0",
]
