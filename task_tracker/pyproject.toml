[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "0.1.0"
description = "A simple CLI task tracker built with Click and Rich"
authors = [{ name = "Task Tracker Contributors" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
tasks = "task_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["task_tracker*"]

[tool.setuptools.package-dir]
"" = "."
